name: Update dashboard

on:
  schedule:
    - cron: "7 * * * *"        # every hour at :07 (UTC)
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full refresh of the slow economic data"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rule tests
        run: python -m unittest discover -s tests -v

      - id: pages
        uses: actions/configure-pages@v5

      - name: Run the update bot
        # If the bot fails, the step is allowed to fail and the last good data is deployed again.
        continue-on-error: true
        run: |
          FULL=""
          if [ "${{ inputs.full }}" = "true" ]; then FULL="--full"; fi
          python bot/update.py --prev "${{ steps.pages.outputs.base_url }}/data/data.json" $FULL

      - name: Check the data file the site will read
        run: python -m unittest tests.test_rules.PublishedFile -v

      - name: Monthly snapshot (keeps the schedule alive and backs up the data)
        # GitHub pauses scheduled workflows in repos with no commits for 60 days.
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            git config user.name "dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/data.json
            git commit -m "Monthly data snapshot $(date -u +%Y-%m)" || true
            git push || true
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
